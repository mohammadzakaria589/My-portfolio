<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakaria Hossain - My Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.title {
            font-size: 14px;
            font-weight: 500;
            color: #a0aec0;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .bio {
            font-size: 14px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 25px;
        }
        .info {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00f2fe;
            margin-bottom: 25px;
        }
        .info p {
            margin-bottom: 12px;
            font-size: 14px;
            word-break: break-all;
        }
        .info p:last-child {
            margin-bottom: 0;
        }
        .info strong {
            color: #00f2fe;
            display: block;
            margin-bottom: 2px;
        }
        .info a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .info a:hover {
            color: #00f2fe;
        }
        .social-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: #1a1a2e;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            transition: opacity 0.3s;
        }
        .social-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- ছবির ফাইলনেম Zakaria.jpg গিটহাবের সাথে হুবহু মিল রেখে বসানো হয়েছে -->
        <img src="Zakaria.jpg" alt="Zakaria Hossain" class="profile-img">
        
        <h1>Zakaria Hossain</h1>
        <p class="title">Tech Developer & Content Creator</p>
        
        <p class="bio">
            প্রযুক্তি ও সৃজনশীলতার মেলবন্ধন। কোডিংয়ের পাশাপাশি কবিতা আবৃত্তি এবং লেখালেখির মাধ্যমে নতুন কিছু সৃষ্টি করতে ভালোবাসি।
        </p>
        
        <div class="info">
            <p><strong>Phone:</strong> <a href="tel:01778249553">01778249553</a></p>
            <p><strong>Phone:</strong> <a href="tel:01617872060">01617872060</a></p>
            <p><strong>Email:</strong> <a href="mailto:ZakariaHossain589@gmail.com">ZakariaHossain589@gmail.com</a></p>
        </div>

        <a href="https://github.com/mohammadzakaria589" target="_blank" class="social-btn">Visit GitHub Profile</a>
    </div>
</body>
</html>
