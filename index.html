<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakaria Hossain - my portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,/ #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.title {
            font-size: 16px;
            font-weight: 500;
            color: #a0aec0;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .info {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00f2fe;
        }
        .info p {
            margin-bottom: 15px;
            font-size: 14px;
            word-break: break-all;
        }
        .info p:last-child {
            margin-bottom: 0;
        }
        .info strong {
            color: #00f2fe;
            margin-right: 10px;
            display: block;
        }
        .info a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .info a:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Zakaria Hossain</h1>
    <p class="title">Tech Developer & Content Creator</p>
    <p class="bio">
        প্রযুক্তি ও সৃজনশীলতার মেলবন্ধন। কোডিংয়ের পাশাপাশি কবিতা আবৃত্তি এবং লেখালেখির মাধ্যমে নতুন কিছু সৃষ্টি করতে ভালোবাসি।
    </p>

    </div>
</div>
